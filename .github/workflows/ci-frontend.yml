name: CI Frontend

on:
  pull_request:
    paths:
      - "apps/frontend/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/ci-frontend.yml"
  push:
    branches:
      - develop
    paths:
      - "apps/frontend/**"
      - "bun.lock"
      - "package.json"
      - "turbo.json"
      - ".github/workflows/ci-frontend.yml"

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check formatting
        run: bun run --filter @archivist/frontend fmt

      - name: Lint frontend
        run: bun run --filter @archivist/frontend lint

      - name: Test frontend
        run: bun run --filter @archivist/frontend test

      - name: Typecheck frontend
        run: bun run --filter @archivist/frontend typecheck

      - name: Build frontend
        run: bun run --filter @archivist/frontend build
