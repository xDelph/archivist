name: Nightly Backfill

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger backfill
        run: |
          curl -s -X POST "${{ secrets.APP_URL }}/api/admin/backfill" \
            -H "Authorization: Bearer ${{ secrets.ADMIN_TOKEN }}" \
            --max-time 10 || true
          echo "Backfill triggered"
