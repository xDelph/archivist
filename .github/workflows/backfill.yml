name: Sync database with Slack

on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      BACKEND_APP_URL: ${{ secrets.BACKEND_APP_URL }}
      APP_URL: ${{ secrets.APP_URL }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - name: Trigger sync
        run: |
          BASE_URL="${BACKEND_APP_URL:-$APP_URL}"
          if [ -z "$BASE_URL" ]; then
            echo "Missing BACKEND_APP_URL/APP_URL secret"
            exit 1
          fi
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "Missing ADMIN_TOKEN secret"
            exit 1
          fi
          ENQUEUE_RESPONSE="$(curl -fsS -X POST "${BASE_URL%/}/api/admin/sync" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "x-trigger-source: github-actions" \
            --connect-timeout 5 \
            --max-time 15)"
          echo "Response: ${ENQUEUE_RESPONSE}"
