name: Backfill Tick

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      BACKEND_APP_URL: ${{ secrets.BACKEND_APP_URL }}
      APP_URL: ${{ secrets.APP_URL }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - name: Trigger backfill tick
        run: |
          BASE_URL="${BACKEND_APP_URL:-$APP_URL}"
          if [ -z "$BASE_URL" ]; then
            echo "Missing BACKEND_APP_URL/APP_URL secret"
            exit 1
          fi
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "Missing ADMIN_TOKEN secret"
            exit 1
          fi
          ENQUEUE_RESPONSE="$(curl -fsS -X POST "${BASE_URL%/}/api/admin/backfill" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            -H "x-trigger-source: github-actions" \
            --connect-timeout 5 \
            --max-time 20 \
            --retry 2 \
            --retry-delay 2)"
          echo "Backfill tick response: ${ENQUEUE_RESPONSE}"
