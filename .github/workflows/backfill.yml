name: Nightly Backfill

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch:       # allow manual trigger from GitHub UI

jobs:
  backfill:
    runs-on: ubuntu-latest
    env:
      BACKEND_APP_URL: ${{ secrets.BACKEND_APP_URL }}
      APP_URL: ${{ secrets.APP_URL }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - name: Trigger backfill
        run: |
          BASE_URL="${BACKEND_APP_URL:-$APP_URL}"
          if [ -z "$BASE_URL" ]; then
            echo "Missing BACKEND_APP_URL/APP_URL secret"
            exit 1
          fi
          if [ -z "$ADMIN_TOKEN" ]; then
            echo "Missing ADMIN_TOKEN secret"
            exit 1
          fi
          curl -s -X POST "${BASE_URL%/}/api/admin/backfill" \
            -H "Authorization: Bearer ${ADMIN_TOKEN}" \
            --max-time 10
          echo "Backfill triggered"
