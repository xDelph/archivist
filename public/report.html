<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Archivist — Top Threads</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text: #e5e5e5;
      --muted: #888;
      --accent: #22c55e;
      --link: #60a5fa;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 100dvh;
    }

    header {
      padding: 20px 24px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    header h1 { font-size: 1.1rem; font-weight: 700; color: #fff; }
    header span { font-size: 0.85rem; color: var(--muted); }

    #threads { max-width: 820px; margin: 0 auto; padding: 16px 16px 40px; }

    .thread-card {
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: border-color 0.15s;
    }
    .thread-card:hover { border-color: #444; }
    .thread-card.open { border-color: #3a3a3a; }

    .thread-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      padding: 14px 16px;
      background: var(--surface);
    }

    .score-badge {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: #1f2e1f;
      color: var(--accent);
      font-weight: 700;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .thread-meta { flex: 1; min-width: 0; }

    .thread-top {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .avatar {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      object-fit: cover;
      background: #333;
      flex-shrink: 0;
    }

    .avatar-placeholder {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      background: #333;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .author { font-weight: 600; font-size: 0.85rem; }
    .channel { color: var(--link); font-size: 0.8rem; }
    .date { color: var(--muted); font-size: 0.78rem; margin-left: auto; }

    .thread-preview {
      color: var(--muted);
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .thread-stats {
      display: flex;
      gap: 12px;
      margin-top: 8px;
      font-size: 0.78rem;
      color: var(--muted);
    }
    .thread-stats span { display: flex; align-items: center; gap: 4px; }

    /* Thread messages */
    .thread-messages {
      display: none;
      padding: 0 16px 16px;
      background: var(--bg);
      border-top: 1px solid var(--border);
    }
    .thread-card.open .thread-messages { display: block; }

    .message {
      display: flex;
      gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid #1f1f1f;
    }
    .message:last-child { border-bottom: none; }

    .msg-avatar {
      width: 28px;
      height: 28px;
      border-radius: 5px;
      object-fit: cover;
      background: #222;
      flex-shrink: 0;
    }

    .msg-avatar-placeholder {
      width: 28px;
      height: 28px;
      border-radius: 5px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--muted);
      flex-shrink: 0;
    }

    .msg-body { flex: 1; min-width: 0; }

    .msg-top {
      display: flex;
      align-items: baseline;
      gap: 8px;
      margin-bottom: 2px;
    }
    .msg-author { font-weight: 600; font-size: 0.85rem; }
    .msg-time { color: var(--muted); font-size: 0.75rem; }

    .msg-text {
      color: var(--text);
      font-size: 0.88rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg-text a { color: var(--link); text-decoration: none; }
    .msg-text a:hover { text-decoration: underline; }

    /* Slack mentions */
    .mention {
      background: rgba(34, 197, 94, 0.12);
      color: var(--accent);
      border-radius: 3px;
      padding: 0 4px;
      font-weight: 600;
      white-space: nowrap;
    }

    .msg-reactions {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      margin-top: 6px;
    }
    .reaction {
      background: #1e2a1e;
      border: 1px solid #2a3a2a;
      border-radius: 12px;
      padding: 2px 8px;
      font-size: 0.78rem;
      color: var(--accent);
    }

    /* File attachments */
    .msg-file { margin-top: 6px; }
    .msg-file-img {
      max-width: 360px;
      max-height: 240px;
      border-radius: 6px;
      object-fit: cover;
      display: block;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .msg-file-img:hover { opacity: 0.85; }
    .msg-file-link { color: var(--link); font-size: 0.85rem; text-decoration: none; }
    .msg-file-link:hover { text-decoration: underline; }
    .msg-file-preview {
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--link);
      font-size: 0.85rem;
    }
    .msg-file-preview:hover { text-decoration: underline; }
    .mime-badge {
      font-size: 0.7rem;
      color: var(--muted);
      background: #2a2a2a;
      border-radius: 3px;
      padding: 1px 5px;
    }

    /* URL previews */
    .url-preview {
      margin-top: 8px;
      border: 1px solid var(--border);
      border-left: 3px solid #3a3a3a;
      border-radius: 4px;
      padding: 10px 12px;
      max-width: 480px;
    }
    .url-preview-title { font-weight: 600; font-size: 0.85rem; margin-bottom: 2px; }
    .url-preview-desc { font-size: 0.8rem; color: var(--muted); margin-bottom: 6px; }
    .url-preview img { max-width: 100%; border-radius: 4px; max-height: 160px; object-fit: cover; }

    .loading { color: var(--muted); font-size: 0.85rem; padding: 16px 0; }
    .empty { color: var(--muted); font-size: 0.9rem; padding: 40px 0; text-align: center; }

    /* File modal */
    .file-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .file-modal-box {
      position: relative;
      width: 90vw;
      height: 90vh;
      background: #111;
      border-radius: 10px;
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .file-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .file-modal-name {
      font-size: 0.85rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .file-modal-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }

    .file-modal-download {
      color: var(--link);
      font-size: 0.8rem;
      text-decoration: none;
    }
    .file-modal-download:hover { text-decoration: underline; }

    .file-modal-close {
      background: none;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1rem;
      line-height: 1;
      cursor: pointer;
      border-radius: 4px;
      padding: 3px 8px;
    }
    .file-modal-close:hover { background: #2a2a2a; }

    .file-modal-body {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .file-modal-body img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 4px;
    }

    .file-modal-body video {
      max-width: 100%;
      max-height: 100%;
      border-radius: 4px;
    }

    .file-modal-body iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 4px;
      background: #fff;
    }

    .modal-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid var(--border);
      color: #fff;
      font-size: 1.4rem;
      line-height: 1;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .modal-nav:hover { background: rgba(0, 0, 0, 0.85); }
    .modal-nav:disabled { opacity: 0.2; cursor: default; }
    .modal-prev { left: 12px; }
    .modal-next { right: 12px; }

    .file-modal-counter {
      font-size: 0.78rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <header>
    <h1>Archivist</h1>
    <span>Top Threads</span>
  </header>
  <div id="threads"><p class="loading">Loading…</p></div>

  <!-- File preview modal -->
  <div id="file-modal" class="file-modal-overlay" style="display:none" role="dialog" aria-modal="true">
    <button class="modal-nav modal-prev" id="modal-prev" title="Previous (←)">&#8592;</button>
    <div class="file-modal-box">
      <div class="file-modal-header">
        <span class="file-modal-name" id="modal-filename"></span>
        <div class="file-modal-actions">
          <span class="file-modal-counter" id="modal-counter"></span>
          <a id="modal-download" class="file-modal-download" target="_blank" rel="noopener">↓ Download</a>
          <button class="file-modal-close" id="modal-close" title="Close (Esc)">✕</button>
        </div>
      </div>
      <div class="file-modal-body" id="modal-body"></div>
    </div>
    <button class="modal-nav modal-next" id="modal-next" title="Next (→)">&#8594;</button>
  </div>

  <script>
    const BASE = '/api/report';
    const unfurlCache = {};
    // Resolved on init: { "U123": "John", ... } and { "C123": "general", ... }
    let USERS = {};
    let CHANNELS = {};

    function tsToDate(ts) {
      return new Date(parseFloat(ts) * 1000).toLocaleDateString('en-GB', {
        day: '2-digit', month: 'short', year: 'numeric'
      });
    }

    function tsToTime(ts) {
      const d = new Date(parseFloat(ts) * 1000);
      return d.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    }

    // Map Slack emoji shortcode names → Unicode
    const EMOJI = {
      'grinning':'😀','smiley':'😃','smile':'😄','grin':'😁','laughing':'😆',
      'sweat_smile':'😅','rofl':'🤣','joy':'😂','slightly_smiling_face':'🙂',
      'wink':'😉','blush':'😊','innocent':'😇','heart_eyes':'😍','kissing_heart':'😘',
      'yum':'😋','stuck_out_tongue':'😛','stuck_out_tongue_winking_eye':'😜',
      'money_mouth_face':'🤑','hugs':'🤗','thinking':'🤔','zipper_mouth_face':'🤐',
      'raised_eyebrow':'🤨','neutral_face':'😐','expressionless':'😑','smirk':'😏',
      'unamused':'😒','roll_eyes':'🙄','grimacing':'😬','relieved':'😌',
      'pensive':'😔','sleepy':'😪','sleeping':'😴','mask':'😷','nauseated_face':'🤢',
      'sneezing_face':'🤧','hot_face':'🥵','cold_face':'🥶','woozy_face':'🥴',
      'dizzy_face':'😵','exploding_head':'🤯','cowboy_hat_face':'🤠',
      'partying_face':'🥳','sunglasses':'😎','nerd_face':'🤓','monocle_face':'🧐',
      'confused':'😕','worried':'😟','cry':'😢','sob':'😭','scream':'😱',
      'rage':'😡','angry':'😠','triumph':'😤','skull':'💀','ghost':'👻',
      'alien':'👽','robot':'🤖','wave':'👋','+1':'👍','thumbsup':'👍',
      '-1':'👎','thumbsdown':'👎','clap':'👏','raised_hands':'🙌','pray':'🙏',
      'handshake':'🤝','muscle':'💪','eyes':'👀','heart':'❤️',
      'orange_heart':'🧡','yellow_heart':'💛','green_heart':'💚','blue_heart':'💙',
      'purple_heart':'💜','black_heart':'🖤','broken_heart':'💔',
      'two_hearts':'💕','sparkling_heart':'💖','white_check_mark':'✅','x':'❌',
      'question':'❓','exclamation':'❗','fire':'🔥','tada':'🎉','confetti_ball':'🎊',
      'trophy':'🏆','crown':'👑','gem':'💎','rocket':'🚀','star':'⭐',
      'star2':'🌟','sparkles':'✨','zap':'⚡','dizzy':'💫','bulb':'💡',
      'link':'🔗','lock':'🔒','unlock':'🔓','key':'🔑','hammer':'🔨',
      'wrench':'🔧','gear':'⚙️','package':'📦','memo':'📝','books':'📚',
      'book':'📖','computer':'💻','phone':'📱','email':'📧','e-mail':'📧',
      'bell':'🔔','loudspeaker':'📢','mega':'📣','chart_with_upwards_trend':'📈',
      'chart_with_downwards_trend':'📉','bar_chart':'📊','calendar':'📅',
      'hourglass':'⌛','alarm_clock':'⏰','sun':'☀️','sunny':'☀️','cloud':'☁️',
      'snowflake':'❄️','rainbow':'🌈','dog':'🐶','cat':'🐱','bear':'🐻',
      'penguin':'🐧','pizza':'🍕','hamburger':'🍔','beer':'🍺','beers':'🍻',
      'coffee':'☕','tada':'🎉','100':'💯','ok_hand':'👌','v':'✌️',
      'crossed_fingers':'🤞','raised_hand':'✋','point_up':'☝️',
      'point_right':'👉','point_left':'👈','point_down':'👇','point_up_2':'👆',
      'moneybag':'💰','dollar':'💵','mag':'🔍','arrow_up':'⬆️',
      'arrow_down':'⬇️','arrow_left':'⬅️','arrow_right':'➡️','sos':'🆘',
      'new':'🆕','cool':'🆒','white_flag':'🏳️','checkered_flag':'🏁',
    };

    function emojiChar(name) {
      return EMOJI[name] || null;
    }

    function demojify(text) {
      return text.replace(/:([a-z0-9_+\-]+):/g, (match, name) =>
        EMOJI[name] ? EMOJI[name] : match
      );
    }

    // Render Slack mrkdwn tokens: mentions, channels, broadcasts, and links.
    // Replaces all <...> patterns, then linkifies remaining bare URLs.
    function renderSlackText(text) {
      const out = text.replace(/<([^>]+)>/g, (match, inner) => {
        // User mention: <@U123> or <@U123|name>
        if (inner.startsWith('@')) {
          const pipe = inner.indexOf('|');
          const id = pipe !== -1 ? inner.slice(1, pipe) : inner.slice(1);
          const fallback = pipe !== -1 ? inner.slice(pipe + 1) : id;
          const name = USERS[id] || fallback;
          return `<span class="mention">@${name}</span>`;
        }
        // Channel mention: <#C123|name>
        if (inner.startsWith('#')) {
          const pipe = inner.indexOf('|');
          const id = pipe !== -1 ? inner.slice(1, pipe) : inner.slice(1);
          const fallback = pipe !== -1 ? inner.slice(pipe + 1) : id;
          const name = CHANNELS[id] || fallback;
          return `<span class="mention">#${name}</span>`;
        }
        // Broadcast mentions
        if (inner === '!here') return `<span class="mention">@here</span>`;
        if (inner === '!channel') return `<span class="mention">@channel</span>`;
        if (inner === '!everyone') return `<span class="mention">@everyone</span>`;
        // URL: <https://...|label> or <https://...>
        if (inner.startsWith('http://') || inner.startsWith('https://')) {
          const pipe = inner.indexOf('|');
          const url = pipe !== -1 ? inner.slice(0, pipe) : inner;
          const label = pipe !== -1 ? inner.slice(pipe + 1) : url;
          return `<a href="${url}" target="_blank" rel="noopener">${label}</a>`;
        }
        return match;
      });
      // Linkify remaining bare URLs not already inside HTML attributes
      return out.replace(/(?<![">])(https?:\/\/[^\s<>"]+)/g, url =>
        `<a href="${url}" target="_blank" rel="noopener">${url}</a>`
      );
    }

    function extractUrls(text) {
      const urls = [];
      const re = /<(https?:\/\/[^|>]+)(?:\|[^>]+)?>/g;
      let m;
      while ((m = re.exec(text)) !== null) urls.push(m[1]);
      const re2 = /(?<![<"])(https?:\/\/[^\s<>"]+)/g;
      while ((m = re2.exec(text)) !== null) urls.push(m[1]);
      return [...new Set(urls)];
    }

    async function fetchUnfurl(url) {
      if (unfurlCache[url] !== undefined) return unfurlCache[url];
      unfurlCache[url] = null;
      try {
        const r = await fetch(`${BASE}/unfurl?url=${encodeURIComponent(url)}`);
        const data = await r.json();
        unfurlCache[url] = (data.title || data.description || data.image) ? data : null;
      } catch (_) {}
      return unfurlCache[url];
    }

    function renderAvatar(avatarUrl, name, size = 'small') {
      const cls = size === 'large' ? 'msg-avatar' : 'avatar';
      const phCls = size === 'large' ? 'msg-avatar-placeholder' : 'avatar-placeholder';
      if (avatarUrl)
        return `<img class="${cls}" src="${avatarUrl}" alt="${name}" loading="lazy">`;
      return `<span class="${phCls}">${(name || '?')[0].toUpperCase()}</span>`;
    }

    function renderPreview(data, url) {
      if (!data) return '';
      return `<div class="url-preview">
        ${data.image ? `<img src="${data.image}" alt="" loading="lazy">` : ''}
        ${data.title ? `<div class="url-preview-title">${data.title}</div>` : ''}
        ${data.description ? `<div class="url-preview-desc">${data.description}</div>` : ''}
        <a href="${url}" target="_blank" rel="noopener" style="font-size:0.75rem;color:var(--muted)">${new URL(url).hostname}</a>
      </div>`;
    }

    // ── File modal ──────────────────────────────────────────────────────────────

    // Current gallery state: array of {url, name, mimetype} + current index
    let modalFiles = [];
    let modalIndex = 0;

    function renderModalContent(url, name, mimetype) {
      let content = '';
      if (mimetype.startsWith('image/')) {
        content = `<img src="${url}" alt="${name}">`;
      } else if (mimetype.startsWith('video/')) {
        content = `<video src="${url}" controls autoplay></video>`;
      } else {
        content = `<iframe src="${url}" title="${name}"></iframe>`;
      }
      document.getElementById('modal-filename').textContent = name;
      document.getElementById('modal-download').href = url;
      document.getElementById('modal-body').innerHTML = content;
      const counter = document.getElementById('modal-counter');
      counter.textContent = modalFiles.length > 1 ? `${modalIndex + 1} / ${modalFiles.length}` : '';
      document.getElementById('modal-prev').disabled = modalIndex === 0;
      document.getElementById('modal-next').disabled = modalIndex === modalFiles.length - 1;
    }

    function openFileModal(files, index) {
      modalFiles = files;
      modalIndex = index;
      renderModalContent(files[index].url, files[index].name, files[index].mimetype);
      document.getElementById('file-modal').style.display = 'flex';
    }

    function closeFileModal() {
      document.getElementById('file-modal').style.display = 'none';
      document.getElementById('modal-body').innerHTML = '';
      modalFiles = [];
    }

    function modalNav(delta) {
      const next = modalIndex + delta;
      if (next < 0 || next >= modalFiles.length) return;
      modalIndex = next;
      renderModalContent(modalFiles[next].url, modalFiles[next].name, modalFiles[next].mimetype);
    }

    document.getElementById('modal-close').addEventListener('click', closeFileModal);
    document.getElementById('modal-prev').addEventListener('click', () => modalNav(-1));
    document.getElementById('modal-next').addEventListener('click', () => modalNav(1));
    document.getElementById('file-modal').addEventListener('click', e => {
      if (e.target === document.getElementById('file-modal')) closeFileModal();
    });
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeFileModal();
      if (e.key === 'ArrowLeft') modalNav(-1);
      if (e.key === 'ArrowRight') modalNav(1);
    });

    // Delegated click handler — collects all sibling files in the same thread for gallery
    document.addEventListener('click', e => {
      const target = e.target.closest('[data-file-url]');
      if (!target) return;
      e.preventDefault();
      // Collect all previewable files in the same thread-messages container
      const container = target.closest('.thread-messages') || document;
      const allTargets = [...container.querySelectorAll('[data-file-url]')];
      const files = allTargets.map(el => ({
        url: el.dataset.fileUrl,
        name: el.dataset.fileName,
        mimetype: el.dataset.fileMime,
      }));
      const index = allTargets.indexOf(target);
      openFileModal(files, index >= 0 ? index : 0);
    });

    // ── File rendering ──────────────────────────────────────────────────────────

    function renderFile(f) {
      const url = f.url || '';
      const name = f.name || 'file';
      const mime = f.mimetype || '';
      const safeName = name.replace(/"/g, '&quot;');

      if (mime.startsWith('image/')) {
        return `<div class="msg-file">
          <img src="${url}" alt="${safeName}" loading="lazy" class="msg-file-img"
               data-file-url="${url}" data-file-name="${safeName}" data-file-mime="${mime}"
               title="Click to enlarge">
        </div>`;
      }

      const canPreview = mime.startsWith('video/') || mime === 'application/pdf' || mime.startsWith('text/');
      if (canPreview) {
        const icon = mime.startsWith('video/') ? '▶' : '📄';
        return `<div class="msg-file">
          <span class="msg-file-preview"
                data-file-url="${url}" data-file-name="${safeName}" data-file-mime="${mime}">
            ${icon} ${safeName} <span class="mime-badge">${mime}</span>
          </span>
        </div>`;
      }

      return `<div class="msg-file">
        <a href="${url}" target="_blank" rel="noopener" class="msg-file-link">📎 ${safeName}</a>
      </div>`;
    }

    // ── Thread loading ──────────────────────────────────────────────────────────

    async function loadThread(card, channelId, threadTs) {
      const container = card.querySelector('.thread-messages');
      if (container.dataset.loaded) return;
      container.dataset.loaded = '1';
      container.innerHTML = '<p class="loading">Loading thread…</p>';

      const r = await fetch(`${BASE}/threads?channel_id=${channelId}&ts=${threadTs}`);
      const data = await r.json();
      const msgs = data.messages || [];

      if (!msgs.length) {
        container.innerHTML = '<p class="empty">No messages.</p>';
        return;
      }

      const html = msgs.map(m => {
        const reactions = (m.reactions || [])
          .map(rx => `<span class="reaction">${emojiChar(rx.name) || rx.name} ${rx.count}</span>`)
          .join('');
        const files = (m.files || []).map(renderFile).join('');
        return `<div class="message">
          ${renderAvatar(m.avatar_url, m.display_name, 'large')}
          <div class="msg-body">
            <div class="msg-top">
              <span class="msg-author">${m.display_name || 'Unknown'}</span>
              <span class="msg-time">${tsToTime(m.ts)}</span>
            </div>
            <div class="msg-text" data-ts="${m.ts}" data-text="${encodeURIComponent(m.text)}">${demojify(renderSlackText(m.text))}</div>
            ${files}
            ${reactions ? `<div class="msg-reactions">${reactions}</div>` : ''}
          </div>
        </div>`;
      }).join('');

      container.innerHTML = html;

      // Lazy unfurl URLs in each message
      container.querySelectorAll('.msg-text').forEach(async el => {
        const text = decodeURIComponent(el.dataset.text);
        const urls = extractUrls(text);
        for (const url of urls.slice(0, 3)) {
          const preview = await fetchUnfurl(url);
          if (preview) {
            el.insertAdjacentHTML('afterend', renderPreview(preview, url));
          }
        }
      });
    }

    async function init() {
      // Pre-load user and channel maps for mention resolution
      try {
        const ctx = await fetch(`${BASE}/context`).then(r => r.json());
        USERS = ctx.users || {};
        CHANNELS = ctx.channels || {};
      } catch (_) {}

      const container = document.getElementById('threads');
      const r = await fetch(`${BASE}/threads`);
      const data = await r.json();
      const threads = data.threads || [];

      if (!threads.length) {
        container.innerHTML = '<p class="empty">No threads yet. Run a backfill to get started.</p>';
        return;
      }

      container.innerHTML = threads.map(t => `
        <div class="thread-card" data-channel="${t.channel_id}" data-ts="${t.thread_ts}">
          <div class="thread-header">
            <div class="score-badge">${t.score}</div>
            <div class="thread-meta">
              <div class="thread-top">
                ${renderAvatar(t.avatar_url, t.display_name)}
                <span class="author">${t.display_name || 'Unknown'}</span>
                <span class="channel">#${t.channel_name}</span>
                <span class="date">${tsToDate(t.thread_ts)}</span>
              </div>
              <div class="thread-preview">${demojify(renderSlackText(t.text || '(no text)'))}</div>
              <div class="thread-stats">
                <span>💬 ${t.reply_count} replies</span>
                <span>⚡ ${t.reaction_count} reactions</span>
                <span>👥 ${t.participant_count} people</span>
              </div>
            </div>
          </div>
          <div class="thread-messages"></div>
        </div>
      `).join('');

      container.querySelectorAll('.thread-card').forEach(card => {
        card.querySelector('.thread-header').addEventListener('click', () => {
          const isOpen = card.classList.toggle('open');
          if (isOpen) {
            loadThread(card, card.dataset.channel, card.dataset.ts);
          }
        });
      });
    }

    init();
  </script>
</body>
</html>
