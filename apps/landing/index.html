<!doctype html>
<html lang="en" data-appearance="dark" data-accent="green">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Arkivist turns your Slack conversations into a searchable, permanent knowledge base. Never lose an important thread again."
    />
    <meta name="theme-color" content="#122019" />
    <link
      rel="icon"
      href="/icons/proposal-e-spines-tight.svg"
      type="image/svg+xml"
    />
    <title>Arkivist — Your Slack conversations, remembered forever</title>
    <script>
      try {
        const t = JSON.parse(localStorage.getItem("arkivist.theme") || "{}");
        const a = ["dark","light"].includes(t.appearance) ? t.appearance : "dark";
        const c = ["red","green","blue"].includes(t.accent) ? t.accent : "green";
        const d = document.documentElement;
        d.dataset.appearance = a;
        d.dataset.accent = c;
        d.style.colorScheme = a;
        const mc = {dark:{red:"#201516",green:"#122019",blue:"#101828"},light:{red:"#fdf4f4",green:"#f4fbf7",blue:"#f4f7fe"}};
        document.querySelector('meta[name="theme-color"]')?.setAttribute("content", mc[a][c]);
      } catch {}
    </script>
  </head>
  <body id="top">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
