<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <rect width="1200" height="630" fill="#0f0f0f"/>
  <!-- subtle grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="#1a1a1a" stroke-width="1"/>
  <!-- green accent bar -->
  <rect x="80" y="240" width="4" height="120" rx="2" fill="#22c55e"/>
  <!-- title -->
  <text x="112" y="305" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="72" font-weight="700" fill="#ffffff" letter-spacing="-2">Archivist</text>
  <!-- subtitle -->
  <text x="113" y="348" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="28" fill="#888888" letter-spacing="0.5">Slack message archiver</text>
  <!-- status dot -->
  <circle cx="113" cy="408" r="6" fill="#22c55e">
    <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="129" y="414" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
        font-size="20" fill="#555555">running</text>
</svg>
