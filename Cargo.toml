[package]
name = "archivist"
version = "0.1.0"
edition = "2024"

[dependencies]
# Vercel runtime
vercel_runtime = "2"

# HTTP
axum = { version = "0.7", features = ["json", "macros"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace"] }
tokio = { version = "1", features = ["full"] }

# DB
sqlx = { version = "0.8", features = ["postgres", "runtime-tokio-rustls", "macros", "migrate", "uuid", "chrono"] }

# HTTP client (Slack Web API)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Cloudflare R2 (S3-compatible object storage)
aws-sdk-s3 = { version = "1", features = ["behavior-version-latest"] }
aws-config = { version = "1", features = ["behavior-version-latest"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Slack signature verification
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Time
chrono = { version = "0.4", features = ["serde"] }

# HTML templating
maud = "0.26"

# Emoji shortcode lookup
emojis = "0.6"

# Misc
uuid = { version = "1", features = ["v4", "serde"] }
dotenvy = "0.15"
bytes = "1"
http = "1"
http-body-util = "0.1"

[[bin]]
name = "slack_events"
path = "api/events.rs"

[[bin]]
name = "health"
path = "api/health.rs"

[[bin]]
name = "admin_backfill"
path = "api/backfill.rs"

[[bin]]
name = "backfill_local"
path = "src/bin/backfill_local.rs"

[[bin]]
name = "archive_files_local"
path = "src/bin/archive_files_local.rs"

[[bin]]
name = "record"
path = "api/record.rs"

[dev-dependencies]
tokio-test = "0.4"
wiremock = "0.6"

[lints.clippy]
all = "deny"
